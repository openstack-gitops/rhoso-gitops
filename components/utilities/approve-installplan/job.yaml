---
apiVersion: batch/v1
kind: Job
metadata:
  name: approve-openstack-installplan
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: installplan-approver
          image: registry.redhat.io/openshift4/ose-tools-rhel9@sha256:17d4647d21d7571c11d6f983400da6544376fe8bde8372776e4779ebd8c6fd53  # :latest as of 2026-07-06
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          env:
            - name: OS_OPERATORS_NAMESPACE
              value: "openstack-operators"
            - name: OS_NAMESPACE
              value: "openstack"
            - name: RETRIES
              value: "30"
            - name: DELAY
              value: "10"
            - name: INSTALL_PLAN_RETRIES
              value: "60"
            - name: DEBUG
              value: "true"
            - name: SUBSCRIPTION_NAME
              value: "openstack"
          command:
            - /bin/bash
            - -c
            - |
              set -eo pipefail
              if [ "${DEBUG}" = "true" ]; then
                set -x
              fi
              # --- Configuration with defaults ---
              # Namespace where the OpenStack operators are installed.
              OS_OPERATORS_NAMESPACE=${OS_OPERATORS_NAMESPACE:-"openstack-operators"}
              # Namespace where the OpenStack control plane is deployed and the OpenStackVersion CR exists.
              OS_NAMESPACE=${OS_NAMESPACE:-"openstack"}
              # Default number of retries for most checks.
              RETRIES=${RETRIES:-60}
              # Number of retries specifically for waiting for the InstallPlan to complete.
              # This is longer because pulling operator images and starting pods can take a significant amount of time.
              INSTALL_PLAN_RETRIES=${INSTALL_PLAN_RETRIES:-60}
              # Delay in seconds between retries.
              DELAY=${DELAY:-10}
              # Name of the OLM Subscription to read startingCSV from.
              SUBSCRIPTION_NAME=${SUBSCRIPTION_NAME:-"openstack"}
              # ---

              log() {
                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $@" >&2
              }

              find_and_approve_installplan() {
                local pinned_csv=""
                pinned_csv=$(oc get subscription "${SUBSCRIPTION_NAME}" \
                  -n "${OS_OPERATORS_NAMESPACE}" \
                  -o jsonpath='{.spec.startingCSV}' 2>/dev/null) || true

                if [ -n "$pinned_csv" ]; then
                  log "Subscription '${SUBSCRIPTION_NAME}' pins startingCSV: ${pinned_csv}"
                else
                  log "Subscription '${SUBSCRIPTION_NAME}' has no startingCSV; will approve any unapproved InstallPlan."
                fi

                log "Waiting for unapproved InstallPlan..."
                local install_plan_name=""
                local all_plans_json=""
                local wrong_plan=""
                local actual_csvs=""
                for i in $(seq 1 $RETRIES); do
                  # Reset per-iteration so the post-loop error reflects the
                  # final observed state, not a transient earlier one.
                  wrong_plan=""
                  actual_csvs=""
                  # Fetch all InstallPlans once per iteration and run every jq
                  # filter below against this single snapshot. This avoids 2-3
                  # separate API calls per iteration and, more importantly,
                  # guarantees all filters reason over one consistent view
                  # (a plan cannot appear/disappear between filters).
                  all_plans_json=$(oc get installplan -n "${OS_OPERATORS_NAMESPACE}" -o json) || true

                  if [ -n "$pinned_csv" ]; then
                    install_plan_name=$(echo "$all_plans_json" | \
                      jq -r --arg csv "$pinned_csv" \
                      '.items[] | select(.spec.approval=="Manual" and .spec.approved==false and (.spec.clusterServiceVersionNames | index($csv))) | .metadata.name' | head -n1) || true

                    if [ -z "$install_plan_name" ]; then
                      wrong_plan=$(echo "$all_plans_json" | \
                        jq -r '.items[] | select(.spec.approval=="Manual" and .spec.approved==false) | .metadata.name' | head -n1) || true

                      if [ -n "$wrong_plan" ]; then
                        actual_csvs=$(echo "$all_plans_json" | \
                          jq -r --arg plan "$wrong_plan" \
                          '.items[] | select(.metadata.name==$plan) | .spec.clusterServiceVersionNames | join(", ")') || true
                        # Do NOT exit here: OLM catalog resolution is eventually
                        # consistent, so a newer-than-pinned plan can appear
                        # transiently before the pinned plan's InstallPlan is
                        # generated. Warn and keep retrying; only fail after the
                        # loop is exhausted (handled below).
                        log "WARNING: InstallPlan '${wrong_plan}' targets CSV [${actual_csvs}], not pinned '${pinned_csv}'. Will retry in case the pinned plan is not resolved yet."
                      fi
                    fi
                  else
                    install_plan_name=$(echo "$all_plans_json" | \
                      jq -r '.items[] | select(.spec.approval=="Manual" and .spec.approved==false) | .metadata.name' | head -n1) || true
                  fi

                  [ -n "$install_plan_name" ] && break
                  log "Attempt $i/$RETRIES: No matching InstallPlan found, retrying..."
                  sleep $DELAY
                done

                if [ -z "$install_plan_name" ]; then
                  if [ -n "$pinned_csv" ] && [ -n "$wrong_plan" ]; then
                    log "ERROR: Only found InstallPlan '${wrong_plan}' targeting CSV [${actual_csvs}], not pinned '${pinned_csv}'."
                    log "ERROR: The catalog resolved a newer version than what is pinned. Refusing to approve."
                  else
                    log "Error: No manual InstallPlan found to approve within the time limit."
                  fi
                  exit 1
                fi

                log "Found InstallPlan: ${install_plan_name}, approving..."
                oc patch installplan "${install_plan_name}" -n "${OS_OPERATORS_NAMESPACE}" --type merge -p '{"spec":{"approved":true}}' >&2
                echo "$install_plan_name"
              }

              wait_for_installplan_completion() {
                local install_plan_name=$1
                for i in $(seq 1 $INSTALL_PLAN_RETRIES); do
                  phase=$(oc get installplan $install_plan_name -n $OS_OPERATORS_NAMESPACE -o jsonpath='{.status.phase}')
                  if [ "$phase" == "Complete" ]; then
                    log "InstallPlan completed successfully."
                    return 0
                  fi
                  if [ $i -eq $INSTALL_PLAN_RETRIES ]; then
                    log "Error: InstallPlan did not complete in time."
                    exit 1
                  fi
                  log "Attempt $i/$INSTALL_PLAN_RETRIES: Status is $phase, retrying..."
                  sleep $DELAY
                done
              }

              wait_for_crd() {
                log "Waiting for OpenStack CRD to become available..."
                for i in $(seq 1 $RETRIES); do
                  if oc get crd openstacks.operator.openstack.org -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' | grep -q True; then
                    log "OpenStack CRD is Established."
                    return 0
                  fi
                  if [ $i -eq $RETRIES ]; then
                    log "Error: OpenStack CRD did not become Established in time."
                    exit 1
                  fi
                  log "Attempt $i/$RETRIES: CRD not Established, retrying..."
                  sleep $DELAY
                done
              }

              wait_for_new_version() {
                log "Waiting for a new OpenStack version to become available..."

                local deployed_version=""
                for i in $(seq 1 $RETRIES); do
                  # There should be only one openstackversion CR
                  deployed_version=$(oc get openstackversion -n $OS_NAMESPACE -o jsonpath='{.items[0].status.deployedVersion}' 2>/dev/null) || true
                  if [ -n "$deployed_version" ]; then
                      log "Current deployed version is: $deployed_version"
                      break
                  fi
                  if [ $i -eq $RETRIES ]; then
                    log "Error: Could not get current deployed version in time."
                    exit 1
                  fi
                  log "Attempt $i/$RETRIES: Waiting for OpenStackVersion resource to get deployedVersion. Retrying..."
                  sleep $DELAY
                done

                for i in $(seq 1 $RETRIES); do
                  available_version=$(oc get openstackversion -n $OS_NAMESPACE -o jsonpath='{.items[0].status.availableVersion}' 2>/dev/null) || true
                  if [ -n "$available_version" ] && [ "$available_version" != "$deployed_version" ]; then
                    log "New available version found: $available_version"
                    return 0
                  fi
                  if [ $i -eq $RETRIES ]; then
                    log "Error: New version did not become available in time."
                    exit 1
                  fi
                  log "Attempt $i/$RETRIES: No new version available yet. Current available is '$available_version'. Retrying..."
                  sleep $DELAY
                done
              }

              # --- Main execution ---
              log "Starting install_plan_approval"

              # Short-circuit: if the pinned CSV is already installed, there is
              # no pending InstallPlan to approve. An upgrade plan for a newer
              # version may exist but we intentionally ignore it (version-gated).
              pinned_csv=$(oc get subscription "${SUBSCRIPTION_NAME}" \
                -n "${OS_OPERATORS_NAMESPACE}" \
                -o jsonpath='{.spec.startingCSV}' 2>/dev/null) || true
              if [ -n "$pinned_csv" ]; then
                csv_phase=$(oc get csv "${pinned_csv}" \
                  -n "${OS_OPERATORS_NAMESPACE}" \
                  -o jsonpath='{.status.phase}' 2>/dev/null) || true
                if [ "${csv_phase}" = "Succeeded" ]; then
                  log "CSV ${pinned_csv} is already installed (phase: Succeeded). Skipping InstallPlan approval."
                  wait_for_crd
                  log "Job completed successfully."
                  exit 0
                fi
              fi

              install_plan_name=$(find_and_approve_installplan)

              log "Waiting for InstallPlan '$install_plan_name' to complete..."

              wait_for_installplan_completion "$install_plan_name"

              log "Checking if this is an initial installation or an update..."
              deployed_version=$(oc get openstackversion -n $OS_NAMESPACE -o jsonpath='{.items[0].status.deployedVersion}' 2>/dev/null) || true
              if [ -n "$deployed_version" ]; then
                log "Deployed version $deployed_version found. This is an update."
                wait_for_new_version
              else
                log "No deployed version found. This is an initial installation."
                wait_for_crd
              fi

              log "Job completed successfully."
      restartPolicy: Never
      serviceAccountName: installplan-approver
