---
name: file-consistency
permissions:
  contents: read
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    paths:
      - "**.yaml"
      - "**.yml"
jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.13'

      - name: Install yaml-lint
        run: pip install yamllint==1.38.0

      - name: Run yaml-lint
        run: yamllint -c .yamllint.yml -s .

  rbac-security-check:
    name: RBAC Wildcard Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check RBAC for dangerous wildcards
        run: python3 .github/scripts/check-rbac-wildcards.py
