---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-openstack
rules:
  - apiGroups:
      - core.openstack.org
    resources:
      - openstackcontrolplanes
    verbs:
      - '*'
  - apiGroups:
      - network.openstack.org
    resources:
      - netconfigs
    verbs:
      - '*'
  - apiGroups:
      - k8s.cni.cncf.io
    resources:
      - network-attachment-definitions
    verbs:
      - '*'
  - apiGroups:
      - nmstate.io
    resources:
      - nmstates
      - nodenetworkconfigurationpolicies
    verbs:
      - '*'
  - apiGroups:
      - metallb.io
    resources:
      - metallbs
      - l2advertisements
      - ipaddresspools
    verbs:
      - '*'
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - project.openshift.io
    resources:
      - projects
    verbs:
      - '*'
  - apiGroups:
      - metal3.io
    resources:
      - baremetalhosts
      - provisionings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - lvm.topolvm.io
    resources:
      - lvmclusters
      - lvmvolumegroups
      - lvmvolumegroupnodestatuses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - 'managedclustersets'
      - 'managedclustersetbindings'
    verbs:
      - '*'
  # multicluster.openshift.io - Currently not used in manifests, but kept for future multicluster features
  # TODO: Remove if not needed, or add specific resources when multicluster is enabled
  # - apiGroups:
  #     - multicluster.openshift.io
  #   resources:
  #     - multiclusterengines
  #     - multiclusterhubs
  #   verbs:
  #     - get
  #     - list
  #     - watch
  #     - create
  #     - update
  #     - patch
  #     - delete
  - apiGroups:
      - baremetal.openstack.org
    resources:
      - openstackbaremetalsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - secrets.hashicorp.com
    resources:
      - 'vaultstaticsecrets'
      - 'vaultconnections'
      - 'vaultauths'
    verbs:
      - '*'
  - apiGroups:
      - external-secrets.io
    resources:
      - 'externalsecrets'
      - 'secretstores'
      - 'clustersecretstores'
    verbs:
      - '*'
  - apiGroups:
      - networking.k8s.io
    resources:
      - 'networkpolicies'
    verbs:
      - '*'
  - apiGroups:
      - operator.openshift.io
    resources:
      - 'externalsecretsconfigs'
      - 'externalsecretsmanagers'
    verbs:
      - '*'
  - apiGroups:
      - operator.openstack.org
    resources:
      - 'openstacks'
    verbs:
      - '*'
  - apiGroups:
      - dataplane.openstack.org
    resources:
      - 'openstackdataplanedeployments'
      - 'openstackdataplanenodesets'
      - 'openstackdataplaneservices'
    verbs:
      - '*'
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-openstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitops-openstack
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
